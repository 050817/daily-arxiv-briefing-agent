paths:
  raw_papers: data/raw/arxiv_papers.json
  ranked_papers: data/processed/ranked_papers.json
  report: outputs/reports/daily_briefing.md
  report_pdf: outputs/reports/daily_briefing.pdf
  figures_dir: outputs/figures
  archive_dir: archives

defaults:
  date_range: last 7 days
  max_results: 50
  top_k: 5
  ranking_method: tfidf

retrieval:
  request_timeout_seconds: 30
  max_retries: 2
  retry_backoff_seconds: 1
  allow_empty_on_error: true
